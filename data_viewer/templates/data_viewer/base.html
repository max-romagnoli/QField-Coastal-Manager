{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}QField Coastal Crowds Data Viewer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/viewer/">
          <img src="{% static 'images/logo.png' %}" alt="QField Coastal Crowds Logo" height="55">
        </a>

        <div class="navbar-middle">
          {% block nav_center %}
          {% endblock %}
        </div>

        <div class="navbar-right">
          <span class="navbar-text">{% block view_mode %}DATA VIEWER{% endblock %}</span>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
